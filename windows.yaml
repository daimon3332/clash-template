# =========================
# 基础配置
# =========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893

tun:
  enable: false
  stack: mixed
  device: Mihomo
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  # 开启了DNS劫持
  dns-hijack:
    - any:53
    - tcp://any:53

# 允许其他设备（同一局域网/docker/外部IP）连接 Clash
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
find-process-mode: strict
keep-alive-idle: 600
keep-alive-interval: 15

external-controller: 127.0.0.1:9090
secret: "123456"
external-ui: "./ui"
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# =========================
# Geo 数据获取
# =========================
geodata-mode: true
geo-auto-update: true
geodata-loader: standard
geo-update-interval: 24
geox-url:
  geoip: https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb
  asn: https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb

# =========================
# 配置文件管理
# =========================
profile:
  store-selected: true
  store-fake-ip: true

# =========================
# 端口监听
# =========================
listeners:
  - name: port-hk
    type: mixed
    port: 42000
    udp: true
  - name: port-sg
    type: mixed
    port: 42001
    udp: true
  - name: port-jp
    type: mixed
    port: 42002
    udp: true
  - name: port-us
    type: mixed
    port: 42003
    udp: true
  - name: port-uk
    type: mixed
    port: 42004
    udp: true
  - name: port-节点选择
    type: mixed
    port: 42005
    udp: true
  - name: china
    type: mixed
    port: 42006
    udp: true

# =========================
# 静态节点 (Local)
# =========================
# =========================
# 机场订阅
# =========================
# =========================
# 嗅探配置
# =========================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true 
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443, 8443]


# =========================
# DNS 配置
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - 'localhost.work.weixin.qq.com'
    - "+.ntp.org"
    - "+.pool.ntp.org"
    - "+.time.windows.com"
    - "+.time.apple.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "stun.*.*"
    - "stun.*.*.*"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 223.6.6.6
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    'geosite:cn':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query



proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - DIRECT
      - 🇺🇸 美国手动
      - 🇭🇰 香港手动
      - 🇸🇬 新加坡手动
      - 🇯🇵 日本手动
      - 🇬🇧 英国手动
      - 亚洲智能筛选
      - 🇭🇰 香港智能筛选

  # 2. 🇺🇸 美国手动
  - name: 🇺🇸 美国手动
    type: select
    include-all: true
    filter: "(?=.*(美|US|🇺🇸|(?i)States|America))^((?!(港|台|日|韩|新|英)).)*$"

  - name: 🔎 Google服务
    type: select
    proxies: [ 亚洲智能筛选, 🇯🇵 日本手动, 🇸🇬 新加坡手动, 🇺🇸 美国手动, 🚀 节点选择]

  - name: 💬 AI 服务
    type: select
    proxies: [🇺🇸 美国手动, 🚀 节点选择]

  - name: 🇭🇰 香港手动
    type: select
    include-all: true
    filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美|英)).)*$"

  - name: 🇸🇬 新加坡手动
    type: select
    include-all: true
    filter: "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|韩|日|美|英)).)*$"

  - name: 🇯🇵 日本手动
    type: select
    include-all: true
    filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美|英)).)*$"
    
  - name: Microsoft
    type: select
    proxies: [🇭🇰 香港智能筛选, 亚洲智能筛选, DIRECT, 🚀 节点选择, 🇭🇰 香港手动, 🇺🇸 美国手动]
    
  - name: 🐱 Github
    type: select
    proxies: [🇭🇰 香港智能筛选, 🚀 节点选择]

  - name: 📹 油管视频
    type: select
    proxies: [🇭🇰 香港智能筛选, 亚洲智能筛选, 🚀 节点选择]
    
  - name: 📲 电报消息
    type: select
    proxies: [🇺🇸 美国手动, 🇭🇰 香港智能筛选, 亚洲智能筛选, 🚀 节点选择]

  - name: Apple
    type: select
    proxies: [🚀 节点选择, DIRECT, 🇭🇰 香港手动, 🇯🇵 日本手动, 🇺🇸 美国手动]
    
  - name: Bilibili
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🇭🇰 香港手动]

  - name: Games
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🇭🇰 香港手动, 🇯🇵 日本手动, 🇺🇸 美国手动]
    
  - name: Netflix
    type: select
    proxies: [亚洲智能筛选, 🚀 节点选择, 🇯🇵 日本手动, 🇸🇬 新加坡手动, 🇺🇸 美国手动]  

  - name: 🇬🇧 英国手动
    type: select
    include-all: true
    filter: "(?=.*(英|UK|United Kingdom|Britain))^((?!(美|港|台|日|韩|新)).)*$"
    
  - name: 🛑 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

  - name: 🏠 私有网络
    type: select
    proxies: [DIRECT, 🚀 节点选择, REJECT]    

  # 8. 智能筛选组
  - name: 🇭🇰 香港智能筛选
    type: smart
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美|英)).)*$"

  - name: 亚洲智能筛选
    type: smart
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?=.*(新加坡|坡|狮城|SG|Singapore|日|JP|(?i)Japan))^((?!(港|台|韩|美|英)).)*$"


